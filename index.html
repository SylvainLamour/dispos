let current=0;

function render(){

const m=months[current];
let html="";

const today = new Date();
today.setHours(0,0,0,0);

m.days.forEach((d,i)=>{

if(i%7===0) html+="<tr>";

let cls="";

if(d.other) cls+=" other";

// date réelle de la cellule
const cellDate = new Date(today.getFullYear(), today.getMonth(), d.day);

// semaine en cours
const weekStart = new Date(today);
weekStart.setDate(today.getDate() - today.getDay() + 1);
weekStart.setHours(0,0,0,0);

const inWeek = cellDate >= weekStart && cellDate <= new Date(weekStart.getTime() + 6*86400000);

// ⚫ passé de la semaine
if(inWeek && cellDate < today){
  cls+=" past";
}

// 🔴 indispo uniquement si pas passé dans la semaine
if(d.indispo && !(inWeek && cellDate < today)){
  cls+=" indispo";
}

if(d.today) cls+=" today";

html+=`<td class="${cls}">${(d.indispo && !(inWeek && cellDate < today)) ? "INDISPO" : d.day}</td>`;

if(i%7===6) html+="</tr>";
});

document.getElementById("cal").innerHTML=html;
}

function nextMonth(){if(current<months.length-1){current++;render();}}
function prevMonth(){if(current>0){current--;render();}}

</script>
